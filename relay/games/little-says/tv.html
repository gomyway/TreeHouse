<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Little Says</title>
<style>
  /* 1920x1080 TV canvas, read from across the room. */
  :root { --bg: #0b0f0c; --card: #172019; --line: #2a3a2e; --ink: #f2efe6; --ink2: #b7c2b4; --ink3: #7d8c7f;
    --p1: #ff7a59; --p2: #4cc3ff; --good: #6bbf59; --bad: #e4572e; --gold: #ffc145; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Satoshi", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { position: absolute; inset: 0; padding: 48px 80px 96px; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; align-items: center; justify-content: space-between; height: 88px; }
  .kicker { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink3); }
  .title { font-size: 44px; font-weight: 800; } .title b { color: var(--gold); }
  .meter { font-size: 26px; color: var(--ink2); }

  .command { text-align: center; min-height: 230px; display: flex; flex-direction: column; justify-content: center; }
  .says { font-size: 52px; font-weight: 800; color: var(--gold); min-height: 64px; }
  .do { font-size: 132px; font-weight: 900; letter-spacing: -4px; line-height: 1; }
  .do.listen { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); opacity: .7; } }
  .window { height: 14px; margin: 22px auto 0; width: 900px; border-radius: 7px; background: var(--line); overflow: hidden; }
  .window i { display: block; height: 100%; width: 0; background: var(--gold); }
  .window.run i { animation: fill var(--w) linear forwards; }
  @keyframes fill { from { width: 100%; } to { width: 0; } }

  .stage { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; min-height: 0; }
  .who { position: relative; border-radius: 32px; border: 4px solid var(--line); background: var(--card); display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }
  .who.p1 { --c: var(--p1); } .who.p2 { --c: var(--p2); }
  .who.seen { border-color: var(--c); }
  .who.out { filter: grayscale(1); opacity: .5; }
  .who.out::after { content: "OUT"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 150px; font-weight: 900; color: rgba(228,87,46,.85); transform: rotate(-12deg); }
  .who svg { width: 300px; height: 100%; background: #0e1510; }
  .info { padding: 28px 32px; display: flex; flex-direction: column; gap: 10px; }
  .badge { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; font-weight: 900; background: var(--c); color: #10140f; }
  .name { font-size: 54px; font-weight: 900; color: var(--c); line-height: 1.05; }
  .sub { font-size: 26px; color: var(--ink3); }
  .lives { font-size: 48px; letter-spacing: 6px; }
  .pts { font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .verdict { position: absolute; right: 28px; top: 24px; font-size: 48px; font-weight: 900; padding: 8px 24px; border-radius: 20px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  .verdict.good { background: var(--good); color: #0b150b; } .verdict.bad { background: var(--bad); color: #fff; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }

  .grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; align-content: start; }
  .pcard { position: relative; border-radius: 24px; border: 3px solid var(--line); background: var(--card); padding: 22px 26px; display: flex; flex-direction: column; gap: 6px; }
  .pcard .name { font-size: 40px; color: var(--ink); } .pcard .lives { font-size: 34px; } .pcard .pts { font-size: 30px; }
  .pcard.out { filter: grayscale(1); opacity: .45; }
  .pcard .verdict { font-size: 30px; right: 16px; top: 16px; padding: 4px 14px; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; }
  .big { font-size: 110px; font-weight: 900; letter-spacing: -3px; line-height: 1.02; } .big .g { color: var(--gold); }
  .sub2 { font-size: 36px; color: var(--ink2); max-width: 1500px; }
  .ranking { list-style: none; display: flex; flex-direction: column; gap: 12px; width: 1100px; }
  .ranking li { display: grid; grid-template-columns: 72px 1fr auto; gap: 20px; align-items: center; padding: 14px 28px; border-radius: 20px;
    background: var(--card); border: 2px solid var(--line); font-size: 40px; font-weight: 700; text-align: left; }
  .ranking li.first { border-color: var(--gold); font-size: 50px; } .ranking .rk { color: var(--ink3); text-align: center; }
</style>
</head>
<body>
<div id="app"><div class="center"><div class="kicker">Little Says</div><div class="big">Getting ready…</div></div></div>
<script>
// Little Says: Simon Says called by the TV (voice only) and judged by its camera.
// Camera: motion_start {mode:"people"} → the host tracks up to 2 real people, numbers them 1 and 2
// (mirror order on entry), streams their skeletons as `people` and arm raises as `motion`
// (arm-raise with the person's own side, both-arms-raise). Each phone can claim "That's me: 1/2"
// to put a name on a figure; phones are optional. Everyone else bets on who survives.

const LIVES = 3, COMMANDS_MAX = 16, SETUP_MS = 25000, REST_MS = 1500;
// need: poses that must all be held in the same camera frame (host people.poses);
// edge: an action that must happen (jump); not: poses that make it wrong (the other arm).
// Level 1 is arms only; level 2 adds body poses; level 3 adds squat, jump and combos.
const MOVES = [
  { key: "left", level: 1, text: "left arm up", show: "LEFT ARM", need: ["arm-left"], not: ["arm-right"] },
  { key: "right", level: 1, text: "right arm up", show: "RIGHT ARM", need: ["arm-right"], not: ["arm-left"] },
  { key: "both", level: 1, text: "both arms up", show: "BOTH ARMS", need: ["arm-left", "arm-right"] },
  { key: "out", level: 2, text: "arms out like an airplane", show: "AIRPLANE", need: ["arms-out"] },
  { key: "head", level: 2, text: "hands on your head", show: "HANDS ON HEAD", need: ["hands-on-head"] },
  { key: "leanL", level: 2, text: "lean to your left", show: "LEAN LEFT", need: ["lean-left"] },
  { key: "leanR", level: 2, text: "lean to your right", show: "LEAN RIGHT", need: ["lean-right"] },
  { key: "squat", level: 3, text: "squat down", show: "SQUAT", need: ["squat"] },
  { key: "jump", level: 3, text: "jump", show: "JUMP", edge: "jump" },
  { key: "c1", level: 3, combo: true, text: "left arm up and lean right", show: "LEFT ARM + LEAN RIGHT", need: ["arm-left", "lean-right"], not: ["arm-right"] },
  { key: "c2", level: 3, combo: true, text: "right arm up and lean left", show: "RIGHT ARM + LEAN LEFT", need: ["arm-right", "lean-left"], not: ["arm-left"] },
  { key: "c3", level: 3, combo: true, text: "hands on your head and squat", show: "HANDS ON HEAD + SQUAT", need: ["hands-on-head", "squat"] },
  { key: "c4", level: 3, combo: true, text: "airplane arms and lean left", show: "AIRPLANE + LEAN LEFT", need: ["arms-out", "lean-left"] },
];
const levelFor = (k) => (k <= 4 ? 1 : k <= 9 ? 2 : 3);
function pickMove() {
  const lv = levelFor(n);
  const pool = MOVES.filter((m) => m.level <= lv && !(phoneMode && m.combo));
  // Favour the newest level so it actually gets harder.
  const fresh = pool.filter((m) => m.level === lv);
  const from = fresh.length && Math.random() < 0.6 ? fresh : pool;
  return from[Math.floor(Math.random() * from.length)];
}
const COLORS = ["#ff7a59", "#4cc3ff"];
const BONES = [["left_shoulder","right_shoulder"],["left_shoulder","left_elbow"],["left_elbow","left_wrist"],["right_shoulder","right_elbow"],["right_elbow","right_wrist"],
  ["left_shoulder","left_hip"],["right_shoulder","right_hip"],["left_hip","right_hip"],["left_hip","left_knee"],["left_knee","left_ankle"],["right_hip","right_knee"],["right_knee","right_ankle"]];

let players = new Map(), joinOrder = [];
let phase = "setup", token = 0;
const who = [0, 1].map((i) => ({ phone: null, name: `Player ${i + 1}`, lives: LIVES, pts: 0, out: false, seen: false, fig: null, everSeen: false }));
let motionState = "starting", autoStart = false;
// Phone mode: no usable camera, so every joined phone plays by tapping the arm it would raise.
let phoneMode = false;
const pp = new Map(); // phone id -> { name, lives, pts, out }
const ppAnswer = new Map(); // phone id -> { key, at } for the current command
let n = 0, current = null, verdicts = [null, null];
const bets = new Map(), betPts = new Map();

const app = document.getElementById("app");
const send = (m) => window.parent.postMessage(m, "*");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const later = (ms, fn) => { const t = token; setTimeout(() => { if (t === token) fn(); }, ms); };
const active = () => joinOrder.map((id) => players.get(id)).filter((p) => p && p.connected);
const whoOf = (phone) => who.findIndex((w) => w.phone === phone);
const inGame = () => [0, 1].filter((i) => !who[i].out && who[i].everSeen);

// ---------- speech with completion ----------
const saidWaiters = new Map(); let sayN = 0;
function say(text, wait = false) {
  if (!wait) { send({ type: "say", text }); return Promise.resolve(); }
  const id = "s" + (++sayN);
  return new Promise((res) => { const t = setTimeout(() => { saidWaiters.delete(id); res(); }, 4500); saidWaiters.set(id, () => { clearTimeout(t); res(); }); send({ type: "say", text, id, interrupt: true }); });
}
function postState(summary) {
  const scores = {};
  for (const w of who) if (w.everSeen) scores[w.name] = w.pts;
  send({ type: "state", summary, phase, scores });
}

// ---------- phones ----------
function screenFor(id) {
  if (phoneMode) {
    const p = pp.get(id);
    if (phase === "final") return { kind: "info", title: p ? (p.out ? "You're out!" : "You survived!") : "Game over", body: p ? `${p.pts} points.` : "Look at the TV." };
    if (!p) return { kind: "info", title: "Watching", body: "Look at the TV." };
    if (p.out) return { kind: "info", title: "You're out!", body: "Cheer from the couch." };
    if (current && current.open && !ppAnswer.has(id)) return { kind: "buttons", prompt: "Listen… only if Little says!", items: current.options.map((m) => ({ id: "do-" + m.key, label: m.show })), deadline: current.closesAt };
    return { kind: "info", title: `${"♥".repeat(p.lives)}  ${p.pts} pts`, body: "Listen to Little." };
  }
  const wi = whoOf(id);
  if (wi >= 0) {
    const w = who[wi];
    if (phase === "final") return { kind: "info", title: w.out ? "You're out!" : "You survived!", body: `${w.pts} points.` };
    if (phase === "setup") return { kind: "info", title: `You're ${wi + 1}`, body: "Stand where the TV shows figure " + (wi + 1) + "." };
    return { kind: "info", title: w.out ? "You're out!" : `${"♥".repeat(w.lives)}  ${w.pts} pts`, body: w.out ? "Cheer from the couch." : "Listen to Little." };
  }
  if (phase === "setup") {
    const items = [0, 1].filter((i) => !who[i].phone).map((i) => ({ id: "me" + i, label: `That's me: ${i + 1}` }));
    items.push({ id: "watch", label: "I'm watching (bet)" });
    return { kind: "buttons", prompt: "Look at the TV. Which figure is you?", items };
  }
  if (phase === "play" && !bets.has(id) && n < 4) {
    return { kind: "buttons", prompt: "Who lasts longer?", items: [0, 1].filter((i) => who[i].everSeen).map((i) => ({ id: "bet" + i, label: `${who[i].name} survives` })) };
  }
  if (phase === "final") return { kind: "info", title: betPts.get(id) ? "Your bet won!" : "Game over", body: "Look at the TV." };
  return { kind: "info", title: bets.has(id) ? `You bet on ${who[bets.get(id)].name}` : "Watching", body: "Look at the TV." };
}
const refreshPhones = () => { for (const p of active()) send({ type: "screen", to: p.id, screen: screenFor(p.id) }); };

// ---------- flow ----------
function startSetup() {
  token++; phase = "setup";
  send({ type: "motion_start", mode: "people", maxPlayers: 2 });
  refreshPhones();
  say(active().length
    ? "Little Says! One or two players, stand in front of the TV. Find your figure, and tap That's me on your phone if you like."
    : "Little Says! One or two players, stand in front of the TV.");
  postState("Setup: players step in front of the TV; each gets a numbered figure.");
  render();
  later(SETUP_MS, startPlay);
  later(15000, () => { if (phase === "setup" && !who.some((w) => w.everSeen) && active().length) enterPhoneMode("no camera signal"); });
}
function claim(phone, choice) {
  if (phase !== "setup" || whoOf(phone) >= 0) return;
  if (choice === "me0" || choice === "me1") {
    const i = choice === "me0" ? 0 : 1;
    if (!who[i].phone) {
      who[i].phone = phone; who[i].name = players.get(phone)?.name ?? who[i].name;
      say(`Hi ${who[i].name}, you're number ${i + 1}.`);
    }
  }
  refreshPhones(); render();
}

function enterPhoneMode(reason) {
  if (phoneMode || phase === "final") return;
  send({ type: "motion_stop" });
  if (!active().length) { say("I can't see anyone and nobody joined by phone. Let's try again later."); return finish(); }
  phoneMode = true;
  for (const p of active().slice(0, 12)) pp.set(p.id, { name: p.name, lives: LIVES, pts: 0, out: false });
  postState(`No camera (${reason}): playing on phones with ${pp.size} players.`);
  token++; phase = "setup";
  say("No camera today, so we'll play on your phones! Tap the arm you'd raise, but only when Little says.", true).then(() => { phase = "setup"; startPlay(); });
}

function startPlay() {
  if (phase !== "setup") return;
  if (!phoneMode && !inGame().length && active().length) return enterPhoneMode("nobody seen");
  token++; phase = "play"; n = 0;
  if (!phoneMode && !inGame().length) { say("I can't see anyone in front of the TV. Let's try again later."); return finish(); }
  refreshPhones(); render();
  say("Only move when Little says. Arms down. Here we go!", true).then(() => later(600, nextCommand));
}

const windowMs = (move) => Math.max(1500, 3400 - n * 120) + (move.combo ? 900 : move.level === 3 ? 400 : 0);
const trapChance = () => Math.min(0.5, 0.2 + n * 0.025);

async function nextCommand() {
  if (phase !== "play") return;
  if (phoneMode) {
    const alive = [...pp.values()].filter((p) => !p.out).length;
    if (n >= COMMANDS_MAX || !alive || (pp.size >= 2 && alive < 2)) return finish();
  } else {
    const playing = inGame(), started = who.filter((w) => w.everSeen).length;
    if (n >= COMMANDS_MAX || !playing.length || (started >= 2 && playing.length < 2)) return finish();
  }
  n++;
  // Back to neutral first, so a pose still held from the last command can't count.
  if (!phoneMode) await neutral(2000);
  if (phase !== "play") return;
  const move = pickMove();
  const trap = n > 2 && Math.random() < trapChance();
  const kidding = !trap && n > 6 && Math.random() < 0.12; // "Little says… just kidding!" is a trap too
  current = { move, trap: trap || kidding, kidding, events: [[], []], frames: [[], []], listenFrom: Date.now() + 300 };
  verdicts = [null, null];
  for (const p of pp.values()) p.verdict = null;
  render();
  const t = token, mine = current;
  if (kidding) await say(`Little says, ${move.text}… just kidding!`, true);
  else await say(trap ? cap(move.text) + "!" : `Little says, ${move.text}!`, true);
  if (t !== token || current !== mine) return;
  const w = windowMs(move) + (phoneMode ? 600 : 0); // a tap needs a little longer than an arm
  current.open = true; current.closesAt = Date.now() + w;
  const others = MOVES.filter((m) => m.key !== move.key && !m.combo).sort(() => Math.random() - 0.5).slice(0, 3);
  current.options = [move, ...others].sort(() => Math.random() - 0.5);
  ppAnswer.clear();
  if (phoneMode) refreshPhones();
  render(w);
  later(w, judge);
}
const cap = (s) => s[0].toUpperCase() + s.slice(1);

function onMotion(m) {
  if (phase !== "play" || !current || Date.now() < current.listenFrom) return;
  for (const a of m.actions ?? []) { const i = a.slot === 1 ? 1 : 0; current.events[i].push({ id: a.id, side: a.side ?? null, at: Date.now() }); }
}
// Wait (up to ms) until everyone in the game is standing neutral.
function neutral(ms) {
  const until = Date.now() + ms;
  return new Promise((res) => {
    const tick = () => {
      const busy = inGame().some((i) => (who[i].fig?.poses ?? []).length > 0);
      if (!busy || Date.now() > until || phase !== "play") return res();
      setTimeout(tick, 120);
    };
    tick();
  });
}
// Did this player do the move during the window? Poses must all show in one frame.
function did(i, move) {
  const c = current;
  if (move.edge) return c.events[i].some((e) => e.id === move.edge);
  return c.frames[i].some((f) => move.need.every((p) => f.has(p)) && !(move.not ?? []).some((p) => f.has(p)));
}
const movedAtAll = (i) => current.events[i].length > 0 || current.frames[i].some((f) => f.size > 0);
function judge() {
  if (phase !== "play" || !current) return;
  const c = current, lines = [];
  c.open = false; c.judged = true;
  if (phoneMode) {
    for (const [id, p] of pp) {
      if (p.out) continue;
      const a = ppAnswer.get(id);
      let ok, why;
      if (c.trap) { ok = !a; why = ok ? "STILL!" : "GOTCHA"; }
      else if (a && a.key === c.move.key) { ok = true; why = "✓"; }
      else { ok = false; why = a ? "WRONG" : "TOO SLOW"; }
      p.verdict = { ok, why };
      if (ok) p.pts += 100;
      else { p.lives--; if (p.lives <= 0) { p.out = true; lines.push(`${p.name} is out!`); } }
    }
    const gotcha = [...pp.values()].filter((p) => p.verdict && !p.verdict.ok && c.trap && !p.out).map((p) => p.name);
    if (gotcha.length) lines.unshift(`Gotcha, ${gotcha.slice(0, 2).join(" and ")}!`);
    render(); refreshPhones();
    postState(`Command ${n}: ${c.trap ? "trap, " : ""}${c.move.text}. ${[...pp.values()].map((p) => `${p.name} ${p.out ? "out" : p.lives + " lives"}, ${p.pts}`).join("; ")}`);
    const line = lines.slice(0, 2).join(" ");
    const go = () => later(REST_MS, nextCommand);
    if (line) say(line, true).then(go); else go();
    return;
  }
  for (const i of inGame()) {
    const w = who[i], any = movedAtAll(i);
    let ok, why;
    if (c.trap) { ok = !any; why = ok ? "STILL!" : "GOTCHA"; }
    else if (did(i, c.move)) { ok = true; why = "✓"; }
    else { ok = false; why = any ? "WRONG MOVE" : "TOO SLOW"; }
    verdicts[i] = { ok, why };
    // Moments with a stick-figure clip of what just happened (the host attaches ~2.5 s of skeletons).
    if (!ok && c.trap && any) { w.gotchas = (w.gotchas ?? 0) + 1; send({ type: "moment", kind: "fail", clip: "pose", title: `Gotcha, ${w.name}!`, caption: c.kidding ? `Moved on "${c.move.text}… just kidding!"` : `Moved on "${c.move.text}" without Little says`, players: [w.name] }); }
    if (ok && !c.trap && (c.move.combo || c.move.level === 3)) send({ type: "moment", kind: "clutch", clip: "pose", title: `${w.name} nailed it`, caption: `Little says: ${c.move.text}`, players: [w.name] });
    if (ok) w.pts += 100;
    else {
      w.lives--;
      if (w.lives <= 0) { w.out = true; lines.push(`${w.name} is out!`); }
      else if (c.trap) lines.push(`Gotcha, ${w.name}! I never said Little says.`);
      else if (c.kidding) lines.push(`${w.name}, I said just kidding!`);
      else if (why === "WRONG MOVE") lines.push(`Not quite, ${w.name}!`);
    }
  }
  render(); refreshPhones();
  postState(`Command ${n}: ${c.trap ? "trap, " : ""}${c.move.text}. ${who.filter((w) => w.everSeen).map((w) => `${w.name} ${w.out ? "out" : w.lives + " lives"}, ${w.pts} pts`).join("; ")}`);
  const line = lines.slice(0, 2).join(" ");
  const go = () => later(REST_MS, nextCommand);
  if (line) say(line, true).then(go); else go();
}

let final = null;
function finish() {
  token++; phase = "final";
  send({ type: "motion_stop" });
  const ranked = (phoneMode ? [...pp.values()] : who.filter((w) => w.everSeen)).sort((a, b) => (b.out ? 0 : 1) - (a.out ? 0 : 1) || b.pts - a.pts || b.lives - a.lives);
  const win = ranked[0], wi = win && !phoneMode ? who.indexOf(win) : -1, correct = [];
  for (const [id, i] of bets) if (i === wi) { betPts.set(id, 100); correct.push(players.get(id)?.name ?? "someone"); }
  final = { ranked, correct };
  const line = win ? `${win.name} wins Little Says with ${win.pts} points!${correct.length ? ` Good bets from ${correct.slice(0, 3).join(", ")}.` : ""}` : "Nobody played. Next time!";
  say(line); refreshPhones(); postState(`Game over. ${line}`); render();
  if (win) {
    send({ type: "moment", kind: "win", title: `${win.name} wins Little Says`, caption: `${win.pts} points${win.out ? "" : ", still standing"}`, players: [win.name] });
    send({ type: "moment", kind: "award", title: "Little Says Champion", players: [win.name] });
  }
  const tricked = ranked.filter((w) => (w.gotchas ?? 0) > 0).sort((a, b) => (b.gotchas ?? 0) - (a.gotchas ?? 0))[0];
  if (tricked) send({ type: "moment", kind: "award", title: "Most Easily Tricked", players: [tricked.name] });
  if (correct.length) send({ type: "moment", kind: "award", title: "Best Bets in the House", players: correct.slice(0, 3) });
  later(12000, () => send({ type: "done" }));
}

// ---------- TV rendering ----------
function figureSvg(i) {
  const f = who[i].fig, c = COLORS[i];
  if (!f) return `<svg viewBox="0 0 300 600"><text x="150" y="300" fill="#7d8c7f" font-size="26" text-anchor="middle">step in</text></svg>`;
  // Fit the person's box into the panel.
  const b = f.box, s = Math.min(260 / Math.max(b.w, 0.01), 560 / Math.max(b.h, 0.01));
  const X = (x) => 150 + (x - (b.x + b.w / 2)) * s, Y = (y) => 300 + (y - (b.y + b.h / 2)) * s;
  const P = f.points, ok = (k) => P[k] && P[k][2] >= 0.3;
  let out = "";
  for (const [a, z] of BONES) if (ok(a) && ok(z)) out += `<line x1="${X(P[a][0])}" y1="${Y(P[a][1])}" x2="${X(P[z][0])}" y2="${Y(P[z][1])}" stroke="${c}" stroke-width="10" stroke-linecap="round"/>`;
  if (ok("nose")) out += `<circle cx="${X(P.nose[0])}" cy="${Y(P.nose[1])}" r="26" fill="none" stroke="${c}" stroke-width="8"/>`;
  for (const side of ["left", "right"]) if (f.arms?.[side] && ok(side + "_wrist")) out += `<circle cx="${X(P[side + "_wrist"][0])}" cy="${Y(P[side + "_wrist"][1])}" r="18" fill="${c}"/>`;
  return `<svg viewBox="0 0 300 600">${out}</svg>`;
}
function whoHtml(i) {
  const w = who[i], v = verdicts[i];
  const status = w.seen ? "the camera sees you" : w.everSeen ? "come back into view" : "step in front of the TV";
  return `<section class="who p${i + 1} ${w.seen ? "seen" : ""} ${w.out ? "out" : ""}" id="who${i}">${figureSvg(i)}
    <div class="info"><div class="badge">${i + 1}</div><div class="name">${esc(w.name)}</div><div class="sub">${status}</div>
    ${phase === "setup" ? "" : `<div class="lives">${"♥".repeat(Math.max(0, w.lives))}<span style="opacity:.2">${"♥".repeat(LIVES - Math.max(0, w.lives))}</span></div><div class="pts">${w.pts} pts</div>`}</div>
    ${v ? `<div class="verdict ${v.ok ? "good" : "bad"}">${v.why}</div>` : ""}</section>`;
}
function render(windowArg) {
  if (phase === "final") {
    const r = final;
    app.innerHTML = `<div class="center"><div class="kicker">Little Says · Final</div><div class="big">${r.ranked[0] ? `<span class="g">${esc(r.ranked[0].name)}</span> wins` : "Game over"}</div>
      <ol class="ranking">${r.ranked.map((w, i) => `<li class="${i === 0 ? "first" : ""}"><span class="rk">${i + 1}</span><span>${esc(w.name)}${w.out ? " · out" : ""}</span><span>${w.pts}</span></li>`).join("")}</ol>
      <div class="sub2">${r.correct.length ? `Winning bets: ${esc(r.correct.join(", "))}` : ""}</div></div>`;
    return;
  }
  const head = `<header><div><div class="kicker">${phase === "play" ? `Command ${n} of ${COMMANDS_MAX}` : "Who's playing?"}</div><div class="title"><b>Little</b> Says</div></div>
    <div class="meter">camera: ${esc(motionState)}${bets.size ? ` · bets: ${bets.size}` : ""}</div></header>`;
  let mid;
  if (phase === "setup") mid = `<div class="command"><div class="says">Find your figure</div><div class="do" style="font-size:92px">${who.some((w) => w.seen) ? "Raise an arm to wave!" : "Stand in front of the TV"}</div></div>`;
  else if (current) {
    const judged = verdicts.some(Boolean);
    mid = judged
      ? `<div class="command"><div class="says">${current.trap ? "Trap! Nobody said Little says:" : "Little says:"}</div><div class="do" style="color:${current.trap ? "var(--bad)" : "var(--ink)"}">${current.move.show}</div></div>`
      : `<div class="command"><div class="says">Listen…</div><div class="do listen">👂</div><div class="window ${windowArg ? "run" : ""}" style="--w:${windowArg ?? 0}ms"><i></i></div></div>`;
  } else mid = `<div class="command"><div class="says">Only move when Little says</div><div class="do">ARMS DOWN</div></div>`;
  if (phoneMode) {
    const cards = [...pp.values()].map((p) => `<section class="pcard ${p.out ? "out" : ""}"><div class="name">${esc(p.name)}</div>
      <div class="lives">${"♥".repeat(Math.max(0, p.lives))}<span style="opacity:.2">${"♥".repeat(LIVES - Math.max(0, p.lives))}</span></div><div class="pts">${p.pts} pts</div>
      ${p.verdict ? `<div class="verdict ${p.verdict.ok ? "good" : "bad"}">${p.verdict.why}</div>` : ""}</section>`).join("");
    app.innerHTML = head + mid + `<div class="grid">${cards}</div>`;
    return;
  }
  app.innerHTML = head + mid + `<div class="stage">${whoHtml(0)}${whoHtml(1)}</div>`;
}
// Figures repaint at the people rate without re-rendering the whole screen.
function paintFigures() { for (const i of [0, 1]) { const el = document.getElementById("who" + i); if (!el) continue; const svg = el.querySelector("svg"); if (svg) svg.outerHTML = figureSvg(i); el.classList.toggle("seen", who[i].seen); } }

// ---------- host messages ----------
function setPlayers(list) {
  const before = new Set(players.keys());
  players = new Map((list ?? []).map((p) => [p.id, p]));
  for (const p of list ?? []) if (!joinOrder.includes(p.id)) joinOrder.push(p.id);
  for (const p of active()) if (!before.has(p.id)) send({ type: "screen", to: p.id, screen: screenFor(p.id) });
  render();
}
function onPeople(people) {
  const was = who.map((w) => w.seen);
  for (const i of [0, 1]) { const p = (people ?? []).find((x) => x.n === i + 1); who[i].fig = p ?? null; who[i].seen = !!p; if (p) who[i].everSeen = true; }
  // Record each player's poses frame by frame while a command is open.
  if (phase === "play" && current && !current.judged && Date.now() >= current.listenFrom) for (const i of [0, 1]) if (who[i].fig) current.frames[i].push(new Set(who[i].fig.poses ?? []));
  if (phase === "setup" && who.some((w) => w.seen) && !autoStart) { autoStart = true; later(8000, startPlay); }
  if (was.some((s, i) => s !== who[i].seen)) render(); else paintFigures();
}
function onVoice(text) {
  const t = String(text ?? "").toLowerCase();
  if (/\b(start|go|ready|begin)\b/.test(t) && phase === "setup") return startPlay();
  if (/\b(stop|end|enough|finish)\b/.test(t) && phase === "play") return finish();
  if (/\bswap\b/.test(t)) { const [a, b] = [who[0].name, who[1].name]; who[0].name = b; who[1].name = a; const [pa, pb] = [who[0].phone, who[1].phone]; who[0].phone = pb; who[1].phone = pa; say("Swapped names."); refreshPhones(); render(); }
}
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || typeof m.type !== "string") return;
  switch (m.type) {
    case "init": setPlayers(m.players); startSetup(); break;
    case "players": setPlayers(m.players); break;
    case "input": {
      const id = m.data?.id; if (!id) return;
      if (phoneMode) {
        if (phase === "play" && current?.open && pp.has(m.player) && !pp.get(m.player).out && !ppAnswer.has(m.player) && String(id).startsWith("do-")) {
          ppAnswer.set(m.player, { key: String(id).slice(3), at: Date.now() });
          send({ type: "screen", to: m.player, screen: { kind: "info", title: "Locked in", body: "Look at the TV." } });
        }
        break;
      }
      if (phase === "setup") claim(m.player, id);
      else if (String(id).startsWith("bet") && whoOf(m.player) < 0 && !bets.has(m.player)) { bets.set(m.player, id === "bet1" ? 1 : 0); send({ type: "screen", to: m.player, screen: screenFor(m.player) }); render(); }
      break;
    }
    case "people": onPeople(m.people); break;
    case "motion": onMotion(m); break;
    case "motion_status":
      motionState = m.state + (m.reason ? ` (${m.reason})` : "");
      if (m.state === "unavailable" && phase !== "final") enterPhoneMode(m.reason || "camera unavailable");
      break;
    case "said": { const f = saidWaiters.get(m.id); if (f) { saidWaiters.delete(m.id); f(); } break; }
    case "voice": onVoice(m.text); break;
  }
});
</script>
