<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick A or B</title>
<style>
  /* Lobby card (PLAN.md "Lobby card"): the right pane of the TV lobby while the room joins.
     Palette "Broadcast", a quiz-show studio. Three sizes (--display is the room code, 14vh), no weight
     above 500, radii <= 1.2vh, no emoji. Laid out in the iframe's own vh/vw for about 1280x1080; never scrolls.
     Idle motion: the studio lights sweep slowly over a grid floor. */
  :root {
    --bg: #0b1630; --ink: #ffffff; --muted: #8b97ab; --accent: #ffb000;
    --display: 14vh; --body: 4.4vh; --tiny: 2.6vh;
    --font: "Satoshi", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 400; }

  /* Backdrop: three spotlight cones sweeping, a perspective grid floor. */
  .stage { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .cone { position: absolute; top: -8vh; width: 46vw; height: 120vh; margin-left: -23vw; opacity: .13;
    background: linear-gradient(to bottom, var(--accent), transparent 78%);
    clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); transform-origin: 50% 0;
    animation: sweep 13s ease-in-out infinite alternate; }
  .cone.c1 { left: 12vw; }
  .cone.c2 { left: 50vw; opacity: .08; animation-duration: 17s; animation-direction: alternate-reverse; }
  .cone.c3 { left: 88vw; animation-duration: 11s; animation-delay: -5s; }
  @keyframes sweep { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  .floor { position: absolute; left: -40vw; right: -40vw; bottom: -2vh; height: 46vh; opacity: .2;
    background-image: linear-gradient(var(--muted) .25vh, transparent .25vh), linear-gradient(90deg, var(--muted) .25vh, transparent .25vh);
    background-size: 7vw 7vh; transform: perspective(36vh) rotateX(58deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60%); mask-image: linear-gradient(to bottom, transparent, #000 60%);
    animation: roll 6s linear infinite; }
  @keyframes roll { to { background-position: 0 7vh; } }

  .card { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 3vh 4vw; text-align: center; }

  /* Seats across the top: the game's icons in join order, the first player is the VIP, then "join" slots.
     Up to 16; above 8 they take two rows, and the icons and the title shrink to keep the card from scrolling. */
  .seats { width: 100%; display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); gap: 1vh 1vw; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: .6vh; min-width: 0; font-size: var(--tiny); line-height: 1.2; }
  .seat .icon { width: 7vh; height: 7vh; display: grid; place-items: center; color: var(--ink); }
  .seat svg { width: 100%; height: 100%; }
  .seat .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .vip { color: var(--accent); letter-spacing: .12em; visibility: hidden; }
  .seat[data-vip] .icon { color: var(--accent); }
  .seat[data-vip] .vip { visibility: visible; }
  .seat[data-state="out"] { opacity: .4; }
  .seat.slot { color: var(--muted); }
  .seat.slot .icon { color: var(--muted); border: .3vh dashed var(--muted); border-radius: 1.2vh; font-size: var(--body); }
  .two .seat .icon { width: 5vh; height: 5vh; }
  .two .seat:not([data-vip]) .vip { display: none; }
  .two .logo { height: 16vh; }

  /* Title treatment: stacked letterforms with a studio-light badge. */
  .logo { height: 25vh; width: auto; max-width: 90vw; overflow: visible; }
  .logo text { font-family: var(--font); }
  .logo .back { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linejoin: round; }
  .logo .front { fill: var(--ink); }
  .logo .badge { fill: var(--accent); }
  .logo .lens { fill: none; stroke: var(--bg); stroke-width: 5; }
  .logo .on-badge { fill: var(--bg); }
  .logo .bulb { fill: var(--ink); }
  .logo .bulb.lit { fill: var(--accent); }

  .hook { font-size: var(--body); line-height: 1.2; color: var(--muted); max-width: 84vw; }

  /* Join block: two studio signs, the URL above the code. */
  .join { display: flex; flex-direction: column; align-items: center; gap: 1.6vh; width: 100%; }
  .sign { background: rgba(0, 0, 0, .35); border-radius: 1.2vh; padding: 1.2vh 3vw; }
  .sign .lbl { font-size: var(--tiny); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .sign.url { border: .3vh solid var(--muted); font-size: var(--body); max-width: 88vw; overflow-wrap: anywhere; line-height: 1.2; }
  .sign.code { border: .5vh dotted var(--accent); display: flex; align-items: center; gap: 3vw; padding: 1.4vh 4vw; }
  #code { font-size: var(--display); line-height: 1; letter-spacing: .12em; color: var(--accent); font-variant-numeric: tabular-nums; }

  .status { font-size: var(--body); line-height: 1.2; }
  .status::before { content: "● "; color: var(--accent); }
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="cone c1"></div><div class="cone c2"></div><div class="cone c3"></div><div class="floor"></div></div>
<main class="card">
  <div class="seats" id="seats"></div>
  <svg class="logo" viewBox="0 0 1020 400" role="img" aria-label="Pick A or B">
    <title>Pick A or B</title>
    <text class="back" x="42" y="262" font-size="250" letter-spacing="6"><tspan>P</tspan><tspan dy="-14">I</tspan><tspan dy="14">C</tspan><tspan dy="-8">K</tspan></text>
    <text class="front" x="30" y="250" font-size="250" letter-spacing="6"><tspan>P</tspan><tspan dy="-14">I</tspan><tspan dy="14">C</tspan><tspan dy="-8">K</tspan></text>
    <g>
      <circle class="bulb" cx="70" cy="330" r="10"/><circle class="bulb lit" cx="150" cy="330" r="10"/><circle class="bulb" cx="230" cy="330" r="10"/>
      <circle class="bulb lit" cx="310" cy="330" r="10"/><circle class="bulb" cx="390" cy="330" r="10"/><circle class="bulb lit" cx="470" cy="330" r="10"/>
      <circle class="bulb" cx="550" cy="330" r="10"/><circle class="bulb lit" cx="630" cy="330" r="10"/>
    </g>
    <polygon class="badge" points="830,22 854,62 891,33 900,79 944,64 937,110 984,111 962,152 1005,169 970,200 1005,231 962,248 984,289 937,290 944,336 900,321 891,367 854,338 830,378 806,338 769,367 760,321 716,336 723,290 676,289 698,248 655,231 690,200 655,169 698,152 676,111 723,110 716,64 760,79 769,33 806,62"/>
    <circle class="lens" cx="830" cy="200" r="124"/>
    <text class="on-badge" x="752" y="212" font-size="140" text-anchor="middle">A</text>
    <text class="on-badge" x="830" y="226" font-size="52" text-anchor="middle">or</text>
    <text class="on-badge" x="908" y="282" font-size="140" text-anchor="middle">B</text>
  </svg>
  <p class="hook">A live quiz-show studio where the room picks A or B and the majority scores.</p>
  <div class="join">
    <div class="sign url"><span class="lbl">Join at</span> <span id="url">your phone</span></div>
    <div class="sign code"><span class="lbl">Code</span><span id="code">····</span></div>
  </div>
  <div class="status" id="status" data-status>Waiting for the room</div>
</main>
<script>
// Bridge (PLAN.md "Lobby card"): the host posts { type: "lobby", code, joinUrl, players, minPlayers,
// maxPlayers, ready, focused } on load and on every change; we post { type: "lobby_ready" } once after
// the first paint. Nothing else: no say, no audio, no network.
// The seat icons are the game's own set (meta.seats, the same markup tv.html draws).
const ICON = (paths) => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${paths}</svg>`;
const SEATS = [
  '<path d="M18 6h12v20a6 6 0 0 1-12 0z"/><path fill="none" d="M12 24a12 12 0 0 0 24 0M24 36v6M16 42h16"/>',
  '<path d="M12 28a12 11 0 0 1 24 0z"/><path d="M6 30h36v9H6z"/>',
  '<path d="M8 12l12-5 5 12-12 5z"/><path d="M25 20l15 22H18z"/>',
  '<path d="M14 6h20v10a10 10 0 0 1-20 0z"/><path fill="none" d="M14 10H8a6 6 0 0 0 6 8M34 10h6a6 6 0 0 1-6 8M24 26v8M16 42h16l-2-8H18z"/>',
  '<path d="M6 19h36v23H6z"/><path d="M6 11l34-6 2 8-34 6z"/>',
  '<path d="M18 14h12v28H18zM6 24h12v18H6zM30 30h12v12H30z"/>',
  '<path fill-rule="evenodd" d="M6 12h36v26H6zM12 19h24v3H12zM12 27h16v3H12z"/>',
  '<path d="M24 5l5.6 12.4 13.4 1.4-10 9 2.9 13.2L24 34.2 12.1 41l2.9-13.2-10-9 13.4-1.4z"/>',
  '<path d="M12 34V22a12 12 0 0 1 24 0v12l4 4H8z"/><path d="M20 40a4 4 0 0 0 8 0z"/>',
  '<path d="M28 4L10 28h12l-4 16 20-26H26z"/>',
].map(ICON);
const MAX_SEATS = 16; // the most a game takes
const short = (name) => (name.length > 10 ? name.slice(0, 9) + "…" : name); // fits 8 across in a 1100 px pane

const seatsEl = document.getElementById("seats"), codeEl = document.getElementById("code");
const urlEl = document.getElementById("url"), statusEl = document.getElementById("status");
const seatOf = new Map(); // id -> SEATS index, stable while the card lives

// The game's rule (tv.html assignSeat): FNV-1a 32-bit of the guid modulo the seat count, else join order.
function assignSeat(p) {
  if (seatOf.has(p.id)) return;
  if (typeof p.guid === "string" && p.guid) {
    let h = 2166136261; for (let k = 0; k < p.guid.length; k++) h = Math.imul(h ^ p.guid.charCodeAt(k), 16777619);
    seatOf.set(p.id, (h >>> 0) % SEATS.length); return;
  }
  const used = new Set(seatOf.values());
  let i = seatOf.size % SEATS.length;
  for (let k = 0; k < SEATS.length && used.has(i); k++) i = (i + 1) % SEATS.length;
  seatOf.set(p.id, i);
}

function seat(p, vip) {
  const el = document.createElement("div");
  el.className = "seat"; el.dataset.player = p.id; el.dataset.state = p.connected === false ? "out" : "in";
  if (vip) el.dataset.vip = "";
  el.innerHTML = `<div class="icon">${SEATS[seatOf.get(p.id)]}</div><div class="nm"></div><div class="vip">VIP</div>`;
  const name = String(p.name ?? "Player");
  el.querySelector(".nm").textContent = short(name);
  el.title = name;
  return el;
}
function slot() {
  const el = document.createElement("div");
  el.className = "seat slot"; el.dataset.slot = "empty";
  el.innerHTML = `<div class="icon">+</div><div class="nm">join</div><div class="vip">VIP</div>`;
  return el;
}

function render(m) {
  const int = (v, d) => (Number.isInteger(v) && v > 0 ? v : d);
  const players = (Array.isArray(m.players) ? m.players : []).filter((p) => p && typeof p.id === "string").slice(0, MAX_SEATS);
  const minPlayers = int(m.minPlayers, 1), maxPlayers = Math.min(MAX_SEATS, int(m.maxPlayers, 8));
  players.forEach(assignSeat);
  const n = Math.max(players.length, maxPlayers);
  seatsEl.style.setProperty("--cols", n > 8 ? Math.ceil(n / 2) : n);
  document.body.classList.toggle("two", n > 8);
  seatsEl.replaceChildren(...players.map((p, i) => seat(p, i === 0)), ...Array.from({ length: n - players.length }, slot));
  codeEl.textContent = typeof m.code === "string" && m.code ? m.code : "····";
  urlEl.textContent = typeof m.joinUrl === "string" && m.joinUrl ? m.joinUrl.replace(/^[a-z][a-z0-9+.-]*:\/\//i, "").replace(/\/$/, "") : "your phone";
  const need = Math.max(0, minPlayers - players.length);
  statusEl.textContent = m.ready === true ? "Everyone in? Say start" : need > 0 ? `Needs ${need} more` : "Waiting for the room";
}

window.addEventListener("message", (e) => {
  const m = e.data;
  if (m && m.type === "lobby") render(m);
});
render({ players: [], maxPlayers: 8 }); // title, backdrop and empty slots before the first lobby message
requestAnimationFrame(() => window.parent.postMessage({ type: "lobby_ready" }, "*"));
</script>
</body>
</html>
