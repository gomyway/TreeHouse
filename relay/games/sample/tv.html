<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick A or B</title>
<style>
  /* Seen from 3 m. Palette "Broadcast" (meta.palette): four tokens, nothing else but pure black/white.
     Three text sizes, no weight above 500, radii <= 1.2vh, no emoji.
     Roster seats: one seat per player on every screen, icons from the quiz-show world (meta.seats). */
  :root {
    --bg: #0b1630; --ink: #ffffff; --muted: #8b97ab; --accent: #ffb000;
    --display: 10vh; --body: 5vh; --tiny: 3vh;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: "Satoshi", system-ui, sans-serif; font-weight: 400; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; padding: 6vh 6vw; text-align: center; }
  /* The round label sits under the screen, never as an eyebrow over the header. */
  .kicker { order: 1; font-size: var(--tiny); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: var(--display); line-height: 1.05; font-weight: 500; }
  .opts { display: flex; gap: 4vw; width: 100%; justify-content: center; }
  .opt { flex: 1; max-width: 40vw; border-radius: 1.2vh; padding: 3vh 3vw; font-size: var(--display); font-weight: 500; line-height: 1; border: .6vh solid var(--muted); }
  .opt small { display: block; font-size: var(--body); font-weight: 400; margin-top: 1.5vh; text-transform: uppercase; letter-spacing: .04em; }
  .opt.a { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .opt.b { background: transparent; color: var(--ink); }
  .opt.win { outline: 1.2vh solid var(--ink); outline-offset: 1vh; }
  .big { font-size: var(--display); font-weight: 500; }
  .row { font-size: var(--body); display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; color: var(--muted); }
  /* Seats: thinking = outlined, answered = filled accent, out = 40% opacity, leader = ★ after the name. */
  #seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5vh 2.5vw; padding: 0 4vw 3vh; font-size: var(--tiny); }
  .seat { display: flex; flex-direction: column; align-items: center; gap: .6vh; min-width: 8vw; }
  .seat svg { width: 7vh; height: 7vh; color: var(--muted); fill: none; stroke: currentColor; transition: color .3s; }
  .seat[data-state="answered"] svg { color: var(--accent); fill: currentColor; }
  .seat[data-state="out"] { opacity: .4; }
  .seat .lead { display: none; color: var(--accent); }
  .seat.leader .lead { display: inline; }
  .seat .pts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .timer { font-size: var(--body); color: var(--accent); font-variant-numeric: tabular-nums; }
  ol { font-size: var(--body); text-align: left; list-style: none; padding: 0; } ol li { padding: .5vh 0; }
</style>
</head>
<body>
<div id="app"><div class="kicker">Pick A or B</div><h1>Waiting for players…</h1></div>
<div id="seats"></div>
<script>
// Bundle contract (PLAN.md "Game bundle"): the host posts init/players/input/sensor/voice to us;
// we post screen/ask/play/say/state/done back to window.parent. No network, no relay access.
const ROUNDS = [
  { q: "Breakfast for dinner?", a: "Pancakes", b: "Waffles" },
  { q: "Dream holiday?", a: "Beach", b: "Mountains" },
  { q: "Which superpower?", a: "Flying", b: "Invisibility" },
];
const PICK_SECONDS = 20, RESULTS_MS = 5000, FINAL_MS = 8000, INTRO_MS = 4000;
// Seat icons from the quiz-show world: single colour (currentColor), viewBox 0 0 48 48, no text.
// The same list is exported as meta.seats. Paths with fill="none" stay outlines when a seat fills.
const ICON = (paths) => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${paths}</svg>`;
const SEATS = [
  ["Microphone", '<path d="M18 6h12v20a6 6 0 0 1-12 0z"/><path fill="none" d="M12 24a12 12 0 0 0 24 0M24 36v6M16 42h16"/>'],
  ["Buzzer", '<path d="M12 28a12 11 0 0 1 24 0z"/><path d="M6 30h36v9H6z"/>'],
  ["Spotlight", '<path d="M8 12l12-5 5 12-12 5z"/><path d="M25 20l15 22H18z"/>'],
  ["Trophy", '<path d="M14 6h20v10a10 10 0 0 1-20 0z"/><path fill="none" d="M14 10H8a6 6 0 0 0 6 8M34 10h6a6 6 0 0 1-6 8M24 26v8M16 42h16l-2-8H18z"/>'],
  ["Clapperboard", '<path d="M6 19h36v23H6z"/><path d="M6 11l34-6 2 8-34 6z"/>'],
  ["Podium", '<path d="M18 14h12v28H18zM6 24h12v18H6zM30 30h12v12H30z"/>'],
  ["Cue card", '<path fill-rule="evenodd" d="M6 12h36v26H6zM12 19h24v3H12zM12 27h16v3H12z"/>'],
  ["Star", '<path d="M24 5l5.6 12.4 13.4 1.4-10 9 2.9 13.2L24 34.2 12.1 41l2.9-13.2-10-9 13.4-1.4z"/>'],
  ["Bell", '<path d="M12 34V22a12 12 0 0 1 24 0v12l4 4H8z"/><path d="M20 40a4 4 0 0 0 8 0z"/>'],
  ["Lightning", '<path d="M28 4L10 28h12l-4 16 20-26H26z"/>'],
].map(([name, paths]) => ({ name, svg: ICON(paths) }));

let players = new Map();      // id -> { id, name, connected }
const scores = new Map();     // id -> points
let round = -1, phase = "waiting", picks = new Map(), deadline = 0, token = 0;
const seatOf = new Map();     // id -> SEATS index, stable for the whole game
const seatEls = new Map();    // id -> seat element in #seats

const app = document.getElementById("app"), seatRow = document.getElementById("seats");
const send = (msg) => window.parent.postMessage(msg, "*");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const nameOf = (id) => players.get(id)?.name ?? "Someone";
const active = () => [...players.values()].filter((p) => p.connected);
const scoreboard = () => Object.fromEntries([...players.values()].map((p) => [p.name, scores.get(p.id) ?? 0]));
const pts = (n) => n + (n === 1 ? " point" : " points");
const and = (names) => names.length < 2 ? names.join("") : names.slice(0, -1).join(", ") + " and " + names.at(-1);
const later = (ms, fn) => { const t = token; setTimeout(() => { if (t === token) fn(); }, ms); };

function postState(summary) { send({ type: "state", summary, phase, scores: scoreboard() }); }

function pickScreen() {
  const r = ROUNDS[round];
  return { kind: "buttons", prompt: r.q, items: [{ id: "a", label: "A · " + r.a }, { id: "b", label: "B · " + r.b }] };
}
// The phone header reuses the seat icon: a display-only custom screen (it never posts input).
// The phone iframe gets no host stylesheet, so it repeats the palette's four tokens and the three sizes.
function seatCard(id) {
  const s = SEATS[seatOf.get(id) ?? 0];
  return { kind: "custom", html: `<style>:root { --bg: #0b1630; --ink: #ffffff; --muted: #8b97ab; --accent: #ffb000; --display: 10vh; --body: 5vh; --tiny: 3vh; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; background: var(--bg); color: var(--ink); font-family: "Satoshi", system-ui, sans-serif; font-size: var(--body); text-align: center; }
    svg { width: 30vh; height: 30vh; color: var(--accent); } p { font-size: var(--tiny); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }</style>
    ${s.svg}<div>${esc(nameOf(id))}</div><p>Your seat: ${esc(s.name)}</p>` };
}
function screenFor(id) {
  if (phase === "intro") return seatCard(id);
  if (phase === "pick" && !picks.has(id)) return pickScreen();
  if (phase === "pick") return { kind: "info", title: "Locked in", body: "Look at the TV." };
  if (phase === "results") return { kind: "info", title: "Round " + (round + 1) + " done", body: "You have " + pts(scores.get(id) ?? 0) + "." };
  if (phase === "final") return { kind: "info", title: "Game over", body: "You scored " + pts(scores.get(id) ?? 0) + "." };
  return { kind: "info", title: "Get ready", body: "The game starts soon." };
}

function startRound(i) {
  token++; round = i; phase = "pick"; picks = new Map(); deadline = Date.now() + PICK_SECONDS * 1000;
  send({ type: "screen", to: "*", screen: pickScreen() });
  const r = ROUNDS[round];
  postState(`Round ${round + 1} of ${ROUNDS.length}: ${r.q} A is ${r.a}, B is ${r.b}. ${active().length} players choosing.`);
  render();
  later(PICK_SECONDS * 1000, endRound);
}

function endRound() {
  if (phase !== "pick") return;
  token++; phase = "results";
  const r = ROUNDS[round];
  const nA = [...picks.values()].filter((v) => v === "a").length, nB = picks.size - nA;
  const side = nA === nB ? null : nA > nB ? "a" : "b";      // tie: everyone who picked scores
  const winners = [...picks].filter(([, v]) => side === null || v === side).map(([id]) => id);
  for (const id of winners) scores.set(id, (scores.get(id) ?? 0) + 1);
  const what = picks.size === 0 ? "Nobody picked." : side === null ? `A tie, ${nA} each.` : `${side === "a" ? r.a : r.b} wins, ${Math.max(nA, nB)} to ${Math.min(nA, nB)}.`;
  const who = winners.length ? ` A point for ${and(winners.map(nameOf))}.` : "";
  send({ type: "say", text: what + who });
  for (const p of active()) send({ type: "screen", to: p.id, screen: screenFor(p.id) });
  postState(`Round ${round + 1} result: ${what}${who}`);
  render({ nA, nB, side, what, who });
  later(RESULTS_MS, () => (round + 1 < ROUNDS.length ? startRound(round + 1) : finish()));
}

function finish() {
  token++; phase = "final";
  const ranked = [...players.values()].sort((x, y) => (scores.get(y.id) ?? 0) - (scores.get(x.id) ?? 0));
  const top = scores.get(ranked[0]?.id) ?? 0;
  const champs = ranked.filter((p) => (scores.get(p.id) ?? 0) === top && top > 0).map((p) => p.name);
  const line = champs.length ? `${and(champs)} ${champs.length > 1 ? "win" : "wins"} with ${pts(top)}!` : "No winner this time.";
  send({ type: "say", text: "Game over. " + line });
  for (const p of active()) send({ type: "screen", to: p.id, screen: screenFor(p.id) });
  postState("Game over. " + line);
  render({ ranked, line });
  later(FINAL_MS, () => send({ type: "done" }));
}

// Seats: from the guid when the player has one (FNV-1a, the host lobby's hash, so the lobby and the
// game agree and a person keeps their icon across games); else by join order, skipping taken seats.
function assignSeat(p) {
  if (seatOf.has(p.id)) return;
  if (typeof p.guid === "string" && p.guid) {
    let h = 2166136261; for (let k = 0; k < p.guid.length; k++) h = Math.imul(h ^ p.guid.charCodeAt(k), 16777619);
    seatOf.set(p.id, (h >>> 0) % SEATS.length); return;
  }
  const used = new Set(seatOf.values());
  let i = seatOf.size % SEATS.length;
  for (let k = 0; k < SEATS.length && used.has(i); k++) i = (i + 1) % SEATS.length;
  seatOf.set(p.id, i);
}
function countUp(el, to) {
  const from = Number(el.dataset.v ?? 0);
  if (from === to) return;
  el.dataset.v = to;
  const t0 = performance.now(); el._anim = t0;
  const step = (now) => {
    if (el._anim !== t0) return;
    const k = Math.min(1, Math.max(0, (now - t0) / 600));
    el.textContent = Math.round(from + (to - from) * k);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawSeats() {
  const list = [...players.values()];
  const top = Math.max(0, ...list.map((p) => scores.get(p.id) ?? 0));
  for (const [id, el] of seatEls) if (!players.has(id)) { el.remove(); seatEls.delete(id); }
  for (const p of list) {
    assignSeat(p);
    let el = seatEls.get(p.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "seat"; el.dataset.player = p.id;
      el.innerHTML = SEATS[seatOf.get(p.id)].svg + `<div><span class="nm"></span><span class="lead"> ★</span></div><div class="pts">0</div>`;
      seatEls.set(p.id, el); seatRow.append(el);
    }
    el.querySelector(".nm").textContent = p.name;
    el.dataset.state = !p.connected ? "out" : (phase === "pick" || phase === "results") && picks.has(p.id) ? "answered" : "thinking";
    el.classList.toggle("leader", top > 0 && (scores.get(p.id) ?? 0) === top);
    countUp(el.querySelector(".pts"), scores.get(p.id) ?? 0);
  }
}

function render(extra = {}) {
  const r = ROUNDS[round];
  if (phase === "intro") {
    app.innerHTML = `<div class="kicker">${active().length} players</div><h1>Pick A or B</h1>
      <div class="row">Side with the room to score. Find your seat below.</div>`;
  } else if (phase === "pick") {
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    app.innerHTML = `<div class="kicker">Round ${round + 1} of ${ROUNDS.length}</div><h1>${esc(r.q)}</h1>
      <div class="opts"><div class="opt a">A<small>${esc(r.a)}</small></div><div class="opt b">B<small>${esc(r.b)}</small></div></div>
      <div class="timer" id="timer">${left}s</div>`;
  } else if (phase === "results") {
    app.innerHTML = `<div class="kicker">Round ${round + 1} result</div>
      <div class="opts"><div class="opt a ${extra.side === "a" ? "win" : ""}">${extra.nA}<small>${esc(r.a)}</small></div>
      <div class="opt b ${extra.side === "b" ? "win" : ""}">${extra.nB}<small>${esc(r.b)}</small></div></div>
      <div class="big">${esc(extra.what)}</div><div class="row">${esc(extra.who)}</div>`;
  } else if (phase === "final") {
    app.innerHTML = `<div class="kicker">Final scores</div><h1>${esc(extra.line)}</h1>
      <ol>${extra.ranked.map((p) => `<li>${esc(p.name)} — ${scores.get(p.id) ?? 0}</li>`).join("")}</ol>`;
  }
  drawSeats();
}
setInterval(() => { const t = document.getElementById("timer"); if (t && phase === "pick") t.textContent = Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) + "s"; }, 250);

function setPlayers(list) {
  const before = new Set(players.keys());
  players = new Map((list ?? []).map((p) => [p.id, p]));
  drawSeats(); // late joiners take the next seat; leavers go to 40%
  for (const p of active()) if (!before.has(p.id)) send({ type: "screen", to: p.id, screen: screenFor(p.id) }); // late joiners
  if (phase === "pick") { render(); if (active().length && active().every((p) => picks.has(p.id))) endRound(); }
}

window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || typeof m.type !== "string") return;
  switch (m.type) {
    case "init":
      if (phase !== "waiting") return;
      players = new Map((m.players ?? []).map((p) => [p.id, p]));
      phase = "intro";
      render(); // seats are assigned here, before the seat cards go out
      for (const p of active()) send({ type: "screen", to: p.id, screen: seatCard(p.id) });
      send({ type: "say", text: "Pick A or B. Side with the room to score." });
      postState(`Pick A or B is starting with ${and(active().map((p) => p.name))}. Majority scores each round.`);
      later(INTRO_MS, () => startRound(0));
      break;
    case "players":
      setPlayers(m.players);
      break;
    case "input": {
      const id = m.data && m.data.id;
      if (phase !== "pick" || picks.has(m.player) || (id !== "a" && id !== "b")) return;
      picks.set(m.player, id);
      send({ type: "screen", to: m.player, screen: screenFor(m.player) });
      render();
      if (active().every((p) => picks.has(p.id))) endRound();
      break;
    }
    case "sensor":
      break; // this game uses no sensors
    case "voice":
      if (phase === "pick" && /\b(skip|next|hurry|time)\b/i.test(m.text ?? "")) endRound();
      break;
  }
});
</script>
</body>
</html>
