name = "little-redwood-relay"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"

# The phone shell is served as static assets from ../phone; the relay, game storage and authoring
# routes hit the worker first.
[assets]
directory = "../phone"
binding = "ASSETS"
run_worker_first = ["/host", "/join", "/health", "/rooms/*", "/games", "/games/*", "/author", "/author/*", "/memories", "/memories/*"]

# Game bundles: <id>/meta.json, <id>/tv.html, plus the bucket listing; authoring job state in jobs/<jobId>.json. `wrangler dev` simulates it locally.
[[r2_buckets]]
binding = "GAMES"
bucket_name = "little-redwood-games"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# One per authoring job: its alarm runs the generation (ctx.waitUntil stops 30 s after the response).
[[durable_objects.bindings]]
name = "AUTHOR_JOB"
class_name = "AuthorJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthorJob"]

[observability]
enabled = true

# Authoring model (the only direct model call in the system). Chosen for decode speed on Fireworks
# serverless: gpt-oss-120b has ~5B active params and streams several hundred tok/s. Fallback if it
# ignores the two-block format: accounts/fireworks/models/qwen3-coder-480b-a35b-instruct.
[vars]
AUTHOR_BASE_URL = "https://openrouter.ai/api/v1"
AUTHOR_MODEL = "anthropic/claude-opus-5.5"
AUTHOR_MAX_TOKENS = "16000"
AUTHOR_DEADLINE_MS = "240000"
# "direct": POST /author calls the model from the AuthorJob alarm. "runner": POST /author only queues
# the job; a Mac runner claims it (POST /author/claim) and publishes the bundle. Runner routes need
# the PUBLISH_TOKEN secret (pnpm exec wrangler secret put PUBLISH_TOKEN).
AUTHOR_MODE = "runner"
