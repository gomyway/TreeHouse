name = "little-redwood-relay"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"

# The phone shell is served as static assets from ../phone; /host, /join and /health hit the worker first.
[assets]
directory = "../phone"
binding = "ASSETS"
run_worker_first = ["/host", "/join", "/health", "/rooms/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
